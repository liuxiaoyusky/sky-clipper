name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Verify and package Chrome research extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match package.json $PACKAGE_VERSION"
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Reject critical development vulnerabilities
        run: npm audit --audit-level=critical

      - name: Verify release build
        run: npm run verify

      - name: Build Chrome release archive
        run: npm run zip

      - name: Stage Chrome release assets
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          cp ".output/fin-report-clipper-${PACKAGE_VERSION}-chrome.zip" \
            "release-assets/fin-report-clipper-${PACKAGE_VERSION}-chrome.zip"
          cp "release-assets/fin-report-clipper-${PACKAGE_VERSION}-chrome.zip" \
            "release-assets/fin-report-clipper-chrome.zip"

      - name: Upload verified Chrome release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fin-report-clipper-chrome-release
          path: |
            release-assets/fin-report-clipper-${{ steps.version.outputs.version }}-chrome.zip
            release-assets/fin-report-clipper-chrome.zip
          if-no-files-found: error

  release:
    name: Publish verified Chrome research extension
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Chrome release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fin-report-clipper-chrome-release
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          ASSETS=(
            "release-assets/fin-report-clipper-${RELEASE_VERSION}-chrome.zip"
            "release-assets/fin-report-clipper-chrome.zip"
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite immutable assets."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --title "Fin-report-clipper $RELEASE_VERSION" \
            --generate-notes
